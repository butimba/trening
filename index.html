<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="90 Dni">
<meta name="theme-color" content="#121821">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

</head><body>
<title>Plan 90 Dni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, today first; calibrated-plate colors mark equipment (blue = dumbbells, yellow = none, red = gym) */
:root{
  --bg:#ECEFF3;--surface:#FFFFFF;--sunk:#E2E6EB;--ink:#121821;--mute:#5A6472;--line:#D3D9E0;
  --blue:#2F5BEA;--amber:#A86A0C;--red:#C8372B;--ok:#1C8A50;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1116;--surface:#151A21;--sunk:#1C232C;--ink:#E5E9EF;--mute:#8B95A3;--line:#27303B;
  --blue:#7590FF;--amber:#F0B43C;--red:#FF6F62;--ok:#43C784;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1116;--surface:#151A21;--sunk:#1C232C;--ink:#E5E9EF;--mute:#8B95A3;--line:#27303B;
  --blue:#7590FF;--amber:#F0B43C;--red:#FF6F62;--ok:#43C784;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 140px}
h1,h2,.num{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1;margin:0}
h2{font-size:22px;line-height:1.1;margin:0}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0}
.mute{color:var(--mute);font-size:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);border-color:var(--blue);color:var(--surface);font-weight:600}
button.sel{background:var(--ink);border-color:var(--ink);color:var(--surface)}
button.ghost{border-color:transparent;background:transparent;color:var(--mute)}
input{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;min-height:40px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ok);margin:0;flex:none}
.num{font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.eq-db{--c:var(--blue)}.eq-bw{--c:var(--amber)}.eq-gym{--c:var(--red)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stat .num{font-size:26px;line-height:1}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}

/* banners */
.note{border-left:4px solid var(--c,var(--blue));background:var(--surface);border-radius:0 10px 10px 0;padding:10px 12px;font-size:15px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.note b{display:block;font-size:14px}

/* segmented */
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:34px;padding:6px 10px;font-size:14px;flex:1}
.seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg button .dot{display:inline-block;vertical-align:middle;margin-right:6px}

/* exercise */
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.exh{display:flex;gap:10px;align-items:flex-start}
.exh .grow h3{font-size:17px}
.ex.done h3{color:var(--mute)}
.ex.done h3::after{content:" ✓";color:var(--ok)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.hint{font-size:14px;color:var(--ink);background:var(--sunk);border-radius:8px;padding:6px 10px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 56px;gap:8px;align-items:center}
.set>span{font-size:13px;color:var(--mute);text-align:center}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}
.step input{width:100%;text-align:center;font-size:18px;font-weight:600}
.set button{padding:0;min-height:44px;font-size:18px}
.set.ok .ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set.ok input{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btnlike{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
textarea{font:inherit;color:inherit;width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.wrow input{width:84px;text-align:center;font-size:18px;font-weight:600}
.setbar{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:8px 12px;font-size:15px}
.datebar{display:flex;align-items:center;gap:8px;text-align:center;font-size:17px}
.datebar button{min-width:48px;font-size:22px;padding:0 12px}
.ex details p{margin:6px 0}
.ex details table{margin-top:6px}
a{color:var(--blue)}

/* demos */
svg.demo{width:116px;height:auto;aspect-ratio:6/5;max-width:34%;flex:none;background:var(--sunk);border-radius:10px}
.dose{font-size:15px;color:var(--mute);margin-top:2px}
.dose .num{font-size:28px;line-height:1;color:var(--ink)}
.cue{font-size:15px;margin-top:4px}
.ex details summary{font-size:14px;color:var(--blue);font-weight:600}
.ex details ol{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-top:0}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{aspect-ratio:1;max-width:100%;min-height:0;padding:0;border-radius:6px;background:var(--sunk);font-size:12px;display:flex;align-items:center;justify-content:center;border:0;border-bottom:3px solid var(--c,transparent);font-variant-numeric:tabular-nums}
.cal .t{outline:2px solid var(--ink)}
.cal .d{background:var(--ok);color:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* chips list */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:14px;padding:6px 10px;min-height:36px}
.chips small{color:var(--mute)}
form.row input{flex:1 1 120px}

details summary{cursor:pointer;font-weight:600;list-style-position:inside}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
svg.chart{width:100%;height:auto;display:block}

/* nav + timer */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--mute);font-weight:600;font-size:14px}
nav button.sel{color:var(--blue);background:none}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(648px,calc(100% - 32px));background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
#timer .num{font-size:30px;line-height:1}
#timer button{background:transparent;color:var(--surface);border-color:color-mix(in srgb,var(--surface) 35%,transparent)}
#timer.end{background:var(--ok)}
.sync{font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main id="app"></main>
<div id="timer" hidden></div>
<nav id="nav"></nav>

<script>
// ===== PROGRAM =====
const START = '2026-10-07', DAYS_TOTAL = 90, KCAL_BASE = 2850, PROTEIN = 130;

// kg: logs weight · unit:'s' = seconds instead of reps · core: kept in the 15-min version · per: 'na stronę' for one-side work
// set: dumbbell setting (H = CIĘŻKIE, L = LEKKIE); plans list H exercises first, so plates change once per session
// steps/err: shown under "Jak to zrobić". Ids are saved in history: never rename or delete, only add (retired ones stay for history).
const EX = {
  // hantle (program domowy)
  row2: { n: 'Wiosłowanie hantlami w opadzie', en: 'dumbbell bent over row', s: '3-4', r: '8-12', rest: 90, kg: 1, set: 'H', core: 1, cue: 'Plecy proste, łokcie ciągniesz do bioder.',
    steps: ['Stań, stopy na szerokość bioder, hantle w dłoniach, kolana lekko ugięte.', 'Pochyl się w biodrach (pupa do tyłu), plecy proste, tułów prawie równolegle do podłogi. Ręce wiszą pod barkami.', 'Przyciągnij obie hantle do dolnych żeber, łokcie blisko ciała. Na górze ściśnij łopatki na 1 s.', 'Opuszczaj przez 2–3 s do pełnego wyprostu rąk.'],
    err: 'Szarpanie tułowiem i zaokrąglone plecy. Jak plecy się garbią, pochyl się mniej.' },
  row1: { n: 'Wiosłowanie jednorącz', en: 'one arm dumbbell row', s: '3-4', r: '8-12', rest: 60, kg: 1, set: 'H', core: 1, per: 'na stronę', cue: 'Ciągnij do biodra, nie do klatki.',
    steps: ['Weź jedną hantlę z ustawienia CIĘŻKIE.', 'Jedno kolano i dłoń na łóżku albo krześle, druga stopa na podłodze. Plecy płasko.', 'Ręka z hantlą wisi prosto pod barkiem. Przyciągnij hantlę w stronę biodra, łokieć blisko ciała. 1 s pauzy na górze.', 'Opuść powoli do pełnego wyprostu. Wszystkie powtórzenia, potem druga strona.'],
    err: 'Obracanie tułowia, żeby pomóc sobie ciałem. Klatka cały czas skierowana w podłogę.' },
  ohtri: { n: 'Wyprost nad głową jedną hantlą', en: 'two hand overhead dumbbell triceps extension', s: '3', r: '8-12', rest: 60, kg: 1, set: 'H', cue: 'Łokcie w sufit, ruszają się tylko przedramiona.',
    steps: ['Usiądź prosto. Złap jedną ciężką hantlę oburącz pod górnym talerzem i unieś ją nad głowę.', 'Łokcie wskazują sufit i są blisko głowy.', 'Opuść hantlę za głowę, aż poczujesz rozciąganie z tyłu ramion.', 'Wyprostuj ręce w górę.'],
    err: 'Łokcie rozjeżdżają się na boki, a lędźwia się wyginają.' },
  latseat: { n: 'Unoszenie hantli bokiem', en: 'dumbbell lateral raise', s: '3-4', r: '12-15', rest: 45, kg: 1, set: 'L', core: 1, cue: 'Prowadź łokciem, stop na wysokości barków.',
    steps: ['Stań prosto, hantle przy udach, łokcie lekko ugięte i takie zostają.', 'Pochyl tułów minimalnie do przodu.', 'Unoś obie ręce bokami do wysokości barków. Prowadzi łokieć, nie dłoń.', 'Opuszczaj powoli przez 2–3 s. Tułów się nie buja.'],
    err: 'Bujanie ciałem i podciąganie barków do uszu. Lepiej mniej powtórzeń, ale czysto.' },
  rearfly: { n: 'Odwrotne rozpiętki siedząc w opadzie', en: 'seated bent over rear delt fly', s: '3', r: '12-15', rest: 45, kg: 1, set: 'L', cue: 'Ręce szeroko na boki, nie wiosłuj.',
    steps: ['Usiądź na brzegu krzesła, pochyl się, aż klatka będzie blisko ud. Hantle wiszą przy łydkach.', 'Łokcie lekko ugięte i takie zostają.', 'Unieś ręce szeroko na boki, aż będą w linii z tułowiem.', 'Opuszczaj powoli. Ruch czujesz z tyłu barków.'],
    err: 'Przyciąganie łokci do tyłu jak przy wiosłowaniu. To ma być szeroki łuk na boki.' },
  curl: { n: 'Uginanie ramion z hantlami', en: 'dumbbell bicep curl', s: '3', r: '12-20', rest: 45, kg: 1, set: 'L', cue: 'Łokcie przy bokach, w dół przez 3 s.',
    steps: ['Stań, hantle wzdłuż ciała, dłonie przodem.', 'Łokcie przy bokach przez cały ruch.', 'Ugnij ręce i unieś hantle do barków. Na górze ściśnij biceps.', 'Opuszczaj przez 3 s do pełnego wyprostu.'],
    err: 'Bujanie tułowiem i wysuwanie łokci do przodu.' },
  pushup: { n: 'Pompki', en: 'push up proper form', s: '4-5', r: '8-20', total: [50, 60], rest: 75, core: 1, cue: 'Ciało jak deska, łokcie skośnie do tyłu.', harder: 'dłonie na hantlach (głębiej) albo stopy na łóżku',
    steps: ['Dłonie trochę szerzej niż barki, ciało proste od głowy do pięt. Napnij brzuch i pośladki.', 'Opuszczaj się przez 2–3 s, łokcie idą skośnie do tyłu (ok. 45° od tułowia), nie na boki.', 'Klatka prawie dotyka podłogi.', 'Wypchnij się do wyprostu.', 'Za trudno: dłonie na łóżku. Kończ serię 1–2 powtórzenia przed upadkiem.'],
    err: 'Opadające biodra i łokcie rozłożone na boki.' },
  pike: { n: 'Pompki pike', en: 'pike push up', s: '3', r: '6-12', rest: 75, core: 1, cue: 'Biodra wysoko, głowa ląduje przed dłońmi.', harder: 'stopy na łóżku albo pauza 2 s na dole',
    steps: ['Pozycja jak do pompki, potem przejdź stopami bliżej dłoni, aż ciało zrobi odwrócone V.', 'Ugnij łokcie i opuść czubek głowy w stronę podłogi, trochę przed dłonie.', 'Wypchnij się z powrotem do V. To ćwiczenie zastępuje wyciskanie nad głowę.'],
    err: 'Łokcie na boki. Mają iść lekko do tyłu.' },
  revcr: { n: 'Odwrotne spięcia brzucha', en: 'reverse crunch', s: '2-3', r: '10-15', rest: 45, core: 1, cue: 'Zwijaj miednicę, nogi się nie bujają.', harder: 'wolniej w dół (3 s) albo nogi bardziej proste',
    steps: ['Leż na plecach, ręce wzdłuż ciała dłońmi w dół. Nogi w górze, kolana zgięte pod kątem prostym.', 'Z wydechem zwiń miednicę w stronę żeber, odrywając biodra kilka cm od podłogi.', 'Opuść powoli, aż kość ogonowa dotknie podłogi.'],
    err: 'Machanie nogami zamiast zwijania miednicy. Ruch jest mały i idzie z brzucha.' },
  hollow: { n: 'Hollow body', en: 'hollow body hold', s: '2-3', r: '20-40', unit: 's', rest: 30, core: 1, cue: 'Lędźwia w podłogę, ciało jak banan.', harder: 'ręce dalej za głowę, nogi niżej',
    steps: ['Leż na plecach, dociśnij lędźwia do podłogi.', 'Unieś barki i nogi kilka cm nad podłogę, ręce wyciągnij za głowę.', 'Trzymaj, oddychając spokojnie.', 'Łatwiej: ręce wzdłuż ciała i ugięte kolana.'],
    err: 'Lędźwia się odklejają. Ugnij kolana albo unieś nogi wyżej.' },
  deadbug: { n: 'Dead bug', en: 'dead bug exercise', s: '2', r: '8-12', rest: 30, per: 'na stronę', cue: 'Lędźwia przyklejone do podłogi.',
    steps: ['Leż na plecach, ręce w górze nad barkami, nogi w górze, kolana zgięte pod kątem prostym.', 'Dociśnij lędźwia do podłogi i trzymaj je tak cały czas.', 'Z wydechem powoli wyprostuj przeciwną rękę za głowę i nogę do przodu, tuż nad podłogą.', 'Wróć i zmień strony.'],
    err: 'Lędźwia odrywają się od podłogi. Wtedy prostuj nogę mniej nisko.' },
  sideplank: { n: 'Deska bokiem', en: 'side plank', s: '2', r: '20-45', unit: 's', rest: 30, per: 'na stronę', cue: 'Biodra wysoko, ciało w jednej linii.',
    steps: ['Połóż się na boku, łokieć pod barkiem, nogi proste jedna na drugiej.', 'Unieś biodra, aż ciało będzie prostą linią od głowy do stóp.', 'Trzymaj, potem druga strona.', 'Łatwiej: kolana ugięte i oparte o podłogę.'],
    err: 'Biodra opadają albo uciekają do tyłu.' },
  ohp: { n: 'Wyciskanie hantli nad głowę siedząc', en: 'seated dumbbell shoulder press', s: '3', r: '8-12', rest: 75, kg: 1, cue: 'Brzuch napięty, nie odchylaj się.',
    steps: ['Usiądź prosto, hantle na wysokości barków, łokcie lekko przed tułowiem.', 'Napnij brzuch, żebra w dół.', 'Wypchnij hantle w górę, aż ręce prawie się wyprostują.', 'Opuszczaj przez 2 s do barków.'],
    err: 'Odchylanie się do tyłu.' },
  // guma / bez sprzętu (wyjazd)
  bandrow: { n: 'Wiosłowanie gumą siedząc', en: 'seated resistance band row', s: '4', r: '15-20', rest: 45, core: 1, cue: 'Łokcie do tyłu, ściśnij łopatki.', harder: 'złap gumę krócej albo owiń ją wokół dłoni',
    steps: ['Usiądź na podłodze, nogi proste. Załóż środek gumy na stopy, końce w dłoniach.', 'Plecy proste, minimalnie odchylone do tyłu.', 'Przyciągnij dłonie do brzucha, łokcie blisko ciała. Ściśnij łopatki na 1 s.', 'Wracaj powoli do wyprostu rąk.'],
    err: 'Kołysanie tułowiem zamiast pracy rąk i pleców.' },
  bandlat: { n: 'Unoszenie bokiem z gumą', en: 'resistance band lateral raise', s: '3', r: '15-20', rest: 45, core: 1, per: 'na stronę', cue: 'Prowadź łokciem, 2 s pauzy na górze.', harder: 'krótszy chwyt albo stań na gumie obiema stopami',
    steps: ['Stań jedną stopą na końcu gumy, drugi koniec w dłoni po tej samej stronie.', 'Łokieć lekko ugięty.', 'Unieś rękę bokiem do wysokości barku, 2 s pauzy.', 'Opuszczaj przez 3 s. Potem druga strona.'],
    err: 'Podciąganie barku do ucha.' },
  bandpull: { n: 'Rozciąganie gumy przed sobą', en: 'band pull apart', s: '3', r: '15-25', rest: 30, cue: 'Łopatki do siebie i w dół.', harder: 'węższy chwyt',
    steps: ['Złap gumę na szerokość barków, ręce proste przed sobą na wysokości barków.', 'Rozciągnij gumę na boki, aż dotknie klatki.', 'Wracaj powoli przez 2 s.'],
    err: 'Uginanie łokci i unoszenie barków.' },
  bandface: { n: 'Face pull z gumą', en: 'band face pull', s: '3', r: '15-20', rest: 30, cue: 'Ciągnij do czoła, łokcie wysoko.', harder: 'odejdź krok dalej',

let col = null; const dirty = new Set(), timers = {}, ver = {}, chain = {};

function persist(key, keepStamp) {

  dirty.add(key); ver[key] = (ver[key] || 0) + 1; clearTimeout(timers[key]);

      .catch(e => e?.code === 'unavailable' ? new Promise(r => setTimeout(r, 1500)).then(write) : Promise.reject(e))
      .then(() => { if (ver[key] === v) dirty.delete(key); setSync('Zsynchronizowane'); })
      .catch(e => { dirty.delete(key); setSync('Nie zapisano (' + (e?.code || 'błąd') + '). Zmień coś, żeby spróbować ponownie.'); });

      if (first && snap.empty && Object.keys(DAYS).length) { // first run: upload local cache
        first = false; Object.keys(DAYS).forEach(k => persist(k, true)); persist('settings', true); return;
      }
      first = false;

function exCard(x, d, eq) {
  const e = EX[x], D = DAYS[d] || {}, cur = D.sets?.[x] || [], n = setsFor(x, d), last = lastEntry(x, d);
  const kg = !!e.kg && eq !== 'bw', lo = +e.r.split('-')[0], u = e.unit === 's' ? 's' : 'powt.';
  const lastOk = last?.sets.filter(Boolean) || [];
  const done = cur.filter(s => s?.ok).length >= n;
  const w = D.ew?.[x] ?? (e.set && eq === 'db' ? kgOf(e.set) : lastOk.at(-1)?.w ?? '');
  const rows = Array.from({ length: n }, (_, i) => {
    const s = cur[i] || {}, r = s.r ?? last?.sets[i]?.r ?? lastOk.at(-1)?.r ?? lo;
    return `<div class="set ${s.ok ? 'ok' : ''}"><span>${i + 1}</span>
      <div class="step"><button data-step="-1" data-x="${x}" data-i="${i}" aria-label="Mniej">−</button><input id="r-${x}-${i}" data-r="${x}" data-i="${i}" inputmode="numeric" value="${r}" aria-label="${u} seria ${i + 1}"><button data-step="1" data-x="${x}" data-i="${i}" aria-label="Więcej">+</button></div>
      <button class="ok" data-ok="${x}" data-i="${i}" aria-label="Seria ${i + 1} zrobiona">✓</button></div>`;
  }).join('');
  const hist = Object.keys(DAYS).filter(k => k < d && DAYS[k].sets?.[x]?.some(s => s?.ok)).sort().slice(-5).reverse();
  return `<div class="ex ${done ? 'done' : ''}">
    <div class="exh">${demoBox(x)}<div class="grow"><h3>${esc(e.n)}</h3>
      <div class="dose"><span class="num">${n} × ${esc(e.r.replace('-', '–'))}</span> <span>${e.unit === 's' ? 'sekund' : 'powtórzeń'}${e.per ? ' ' + e.per : ''}</span></div>
      <div class="mute">przerwa ${e.rest} s${e.set && eq === 'db' ? ` · hantle ${SETNAME[e.set]}` : ''}</div>
      <p class="cue">${esc(e.cue)}</p>${e.total ? `<p class="cue"><b>Cel: ${e.total[0]}–${e.total[1]} razem</b> w jak najmniejszej liczbie serii · zrobione: <b class="tn">${cur.filter(s => s?.ok).reduce((a, s) => a + (+s.r || 0), 0)}</b></p>` : ''}</div></div>
    <details><summary>Jak to zrobić</summary>${e.steps ? `<ol>${e.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : `<p style="margin-top:6px">${esc(e.how || '')}</p>`}
      ${e.err ? `<p><b>Uważaj:</b> ${esc(e.err)}</p>` : ''}${e.harder ? `<p class="mute">Za łatwo? ${esc(e.harder)}.</p>` : ''}
      <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.en + ' form')}" target="_blank" rel="noopener" style="font-size:14px">Zobacz film</a></details>
    ${hist.length ? `<details><summary>Historia</summary><table>${hist.map(k => `<tr><td class="mute">${fmt(k)}</td><td>${DAYS[k].sets[x].filter(s => s?.ok).map(s => (s.w ? fmtKg(s.w) + '×' : '') + s.r).join(', ')}</td></tr>`).join('')}</table></details>` : ''}
    <div class="hint">${esc(hint(x, d, eq))}</div>
    ${kg ? `<label class="wrow"><span>Ciężar na hantlę</span><input id="w-${x}" data-ew="${x}" inputmode="decimal" value="${w === '' ? '' : fmtKg(w)}"> kg <span class="mute">cały czas ten sam</span></label>` : ''}
    <div class="sets">${rows}</div>
    <button class="ghost" data-addset="${x}" style="align-self:flex-start;min-height:32px;padding:4px 0;color:var(--blue)">+ dodaj serię</button>
  </div>`;
}
// records = exercises beaten vs last time (more weight, or same weight and more reps)
function prCount(d) {
  return Object.entries(DAYS[d]?.sets || {}).filter(([x, a]) => {
    const now = a.filter(s => s?.ok), last = lastEntry(x, d)?.sets.filter(Boolean) || [];
    if (!now.length || !last.length) return false;
    const best = arr => arr.reduce((b, s) => (+s.w || 0) > b.w || ((+s.w || 0) === b.w && +s.r > b.r) ? { w: +s.w || 0, r: +s.r } : b, { w: -1, r: 0 });
    const a1 = best(now), b1 = best(last);
    return a1.w > b1.w || (a1.w === b1.w && a1.r > b1.r);
  }).length;
}

// ===== EVENTS =====
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const B = b.dataset, d = cur();
  if (B.tab) { ui.tab = B.tab; cacheLS(); render(); scrollTo(0, 0); return; }
  if (B.t) { if (B.t === 'stop') tmr = null; else if (tmr) { tmr.end = Math.max(tmr.end, Date.now()) + 15000; tmr.done = false; } tickTimer(); return; }
  if (B.quick) { ui.quick = B.quick === '1'; cacheLS(); render(); return; }
  if (B.force) { ui.force = true; render(); return; }
  if (B.eqday) { const D = day(d); if (B.eqday === 'auto') delete D.eq; else D.eq = B.eqday; persist(d); render(); return; }
  if (B.ses) { day(d).ses = B.ses; persist(d); render(); return; }
  if (B.dnav) { const nd = B.dnav === '0' ? today() : addDays(d, +B.dnav); ui.date = nd === today() ? null : nd; ui.force = false; render(); scrollTo(0, 0); return; }
  if (B.goto) { ui.date = B.goto === today() ? null : B.goto; ui.tab = 'dzis'; ui.force = false; render(); scrollTo(0, 0); return; }
  if (B.step) {
    const inp = document.getElementById(`r-${B.x}-${B.i}`), v = Math.max(0, (+inp.value || 0) + +B.step);
    inp.value = v; const arr = ((day(d).sets ||= {})[B.x] ||= []); for (let j = 0; j <= +B.i; j++) arr[j] ||= {}; arr[+B.i].r = v; persist(d); return;
  }
  if (B.addset) { const D = day(d); (D.extra ||= {})[B.addset] = (D.extra[B.addset] || 0) + 1; persist(d); render(); return; }
  if (B.fin) { day(d).fin = true; tmr = null; persist(d); render(); return; }
  if (B.plate) { const [k, v] = B.plate.split(':'), a = SET[k], i = a.indexOf(+v); i < 0 ? a.push(+v) : a.splice(i, 1); a.sort((x, y) => x - y); persist('settings'); render(); return; }
  if (B.ok) {
    const D = day(d), x = B.ok, i = +B.i, arr = ((D.sets ||= {})[x] ||= []), s = arr[i] ||= {};
    if (s.ok) { s.ok = false; persist(d); render(); return; }
    const rIn = document.getElementById(`r-${x}-${i}`), wIn = document.getElementById(`w-${x}`);
    if (rIn.value === '') { rIn.focus(); return; }
    s.r = +rIn.value.replace(',', '.'); s.w = wIn ? +wIn.value.replace(',', '.') || undefined : undefined;
    s.ok = true; D.ses ||= sessionFor(d);
    for (let j = 0; j < arr.length; j++) arr[j] ||= {};
    persist(d); startTimer(EX[x].rest); keepAwake(); render(); return;
  }
  if (B.ai) { const t = document.getElementById('aitext').value.trim(); if (t && ai && !aiState?.busy) askFood(t); return; }
  if (B.aiadd) { (day(d).food ||= []).push(...aiState.items); aiState = null; persist(d); render(); return; }
  if (B.food) { const f = FOODS[+B.food]; (day(d).food ||= []).push({ n: f[0], p: f[1], k: f[2] }); persist(d); render(); return; }
  if (B.delfood) { day(d).food.splice(+B.delfood, 1); persist(d); render(); return; }
  if (B.kadj) { SET.kcalAdj = (SET.kcalAdj || 0) + +B.kadj; SET.adjAt = d; persist('settings'); render(); return; }
  if (B.copy) {
    const txt = JSON.stringify({ v: 2, days: DAYS, set: SET }), ta = document.getElementById('xfer');
    const fallback = () => { ta.value = txt; ta.focus(); ta.select(); xferMsg = ''; b.nextElementSibling?.remove(); b.insertAdjacentHTML('afterend', '<span class="mute">Zaznaczone. Skopiuj ręcznie.</span>'); };
    try { navigator.clipboard.writeText(txt).then(() => { xferMsg = `Skopiowano ${Object.keys(DAYS).length} dni.`; render(); }, fallback); } catch { fallback(); }
    return;
  }
  if (B.import) {
    try { const n = importText(document.getElementById('xfer').value.trim()); xferMsg = `Wczytano ${n} dni.`; }
    catch { xferMsg = 'To nie wygląda na dane z tej apki. Skopiuj je jeszcze raz.'; }
    render(); return;
  }
  if (B.deltrip) { SET.trips.splice(+B.deltrip, 1); persist('settings'); render(); return; }
});
document.addEventListener('change', e => {
  const t = e.target, T = t.dataset, d = cur();
  if (T.flag) { day(d)[T.flag] = t.checked; persist(d); return; }
  if (T.post) { (day(d).post ||= {})[T.post] = t.checked; persist(d); render(); return; }
  if (T.r) {
    const D = day(d), arr = ((D.sets ||= {})[T.r] ||= []); for (let j = 0; j <= +T.i; j++) arr[j] ||= {};
    const v = t.value.replace(',', '.'); arr[+T.i].r = v === '' ? undefined : +v; persist(d); return;
  }
  if (T.ew) { // one weight for the whole exercise; logged sets take it too
    const D = day(d), v = +t.value.replace(',', '.'); (D.ew ||= {})[T.ew] = v || undefined;
    (D.sets?.[T.ew] || []).forEach(s => { if (s?.ok) s.w = v || undefined; }); persist(d); return;
  }
  if (T.note) { day(d).note = t.value.slice(0, 2000); persist(d); return; }
  if (t.id === 'aiphoto' && t.files.length && ai && !aiState?.busy) {
    const files = [...t.files].slice(0, aiImg?.maxCount || 1);
    Promise.all(files.map(shrink)).then(b => askFood(document.getElementById('aitext').value.trim(), b)); t.value = ''; return;
  }
  if (T.handle) { SET.handle = +t.value.replace(',', '.') || 0; persist('settings'); render(); return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target), id = e.target.id, d = cur();
  if (id === 'addfood') { (day(d).food ||= []).push({ n: f.get('n').trim(), p: Math.round(+f.get('p')), k: Math.round(+f.get('k')) || 0 }); persist(d); }
  if (id === 'addw') { const k = f.get('d'); day(k).w = +(+f.get('kg')).toFixed(1); persist(k); }
  if (id === 'addbolt') { day(d).bolt = Math.round(+f.get('s')); persist(d); }
  if (id === 'addtrip') {
    let [from, to] = [f.get('from'), f.get('to')]; if (to < from) [from, to] = [to, from];
    SET.trips.push({ from, to, eq: f.get('eq'), label: f.get('label').trim() }); SET.trips.sort((a, b) => a.from < b.from ? -1 : 1); persist('settings');
  }
  render();
});

// app left open overnight: show the new day when it comes back to front (not mid-workout: cur() keeps the old day until then)
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== shownDay && !(trained(DAYS[shownDay]) && !DAYS[shownDay].fin)) { shownDay = today(); ui.force = false; render(); } });

render();
initDb();
</script>
